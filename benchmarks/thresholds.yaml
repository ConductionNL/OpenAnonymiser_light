# Minimum precision/recall thresholds per entity type
# Used by evaluate.py to validate model performance
#
# Can be organized by profile (gliner, spacy, strict) or used flat.
# When --profile is given, evaluate.py reads the matching profile section.
# Otherwise, the flat top-level keys are used.

# --- Flat thresholds (used when no --profile is specified) ---

PERSON:
  precision: 0.0
  recall: 0.0

EMAIL:
  precision: 0.0
  recall: 0.0

