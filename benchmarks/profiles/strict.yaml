# Strict evaluation profile
#
# Uses IoU ≥ 0.75 — demands near-exact span boundary alignment.
# Useful as an upper-bound comparison to measure how much
# lenient matching inflates scores.
#
# Usage:
#   uv run benchmarks/evaluate.py --profile strict

matching:
  strategy: iou
  iou_threshold: 0.75
  score_threshold: 0.4
  coverage_threshold: 0.5
  length_ratio_threshold: 0.7

thresholds: {}
